name = "xion-mainnet-stats-cron-collector"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[triggers]
crons = ["*/5 * * * *", "0 3 * * *"]  # Every 5 minutes (balances), daily at 3 AM UTC (holders)

[vars]
SUPABASE_URL = "https://tbmigahibhsivzsfudmk.supabase.co"
# SUPABASE_KEY should be set via `wrangler secret put SUPABASE_KEY`
